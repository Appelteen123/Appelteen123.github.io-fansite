<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHStarted</title>
    <link rel="stylesheet" href="welcome.css">
    <link rel="icon" type="image/x-icon" href="images/ahs.ico">
    <script src="welcome.js" defer></script>
</head>
<body>
    <main class="landing">
        <section class="landing-content">
            <h1>AHStarted</h1>
            <p class="intro">Are you older than 16?</p>
            <div class="age-buttons">
                <button class="age-button" id="yes-button" type="button">Yes, proceed</button>
                <button class="age-button age-button-secondary" id="no-button" type="button">No</button>
            </div>
            <p class="access-message" id="access-message" role="alert" hidden>
                Access denied. You must be older than 16 to enter this website.
            </p>
        </section>
    </main>
</body>
</html>
